{% extends 'storage_app/base.html' %}
{% block title %}Page Not Found{% endblock %}

{% block content %}
<div class="error-page">
    <div class="glass-card text-center py-5" style="max-width:500px;margin:auto;">
        <i class="bi bi-cloud-slash-fill" style="font-size:4rem;color:var(--primary);"></i>
        <h1 class="mt-3">404</h1>
        <h5 class="text-muted">This page drifted off into the cloud.</h5>
        <a href="{% url 'home' %}" class="btn btn-gradient mt-4"><i class="bi bi-house-fill"></i> Back to Home</a>
    </div>
</div>
{% endblock %}
