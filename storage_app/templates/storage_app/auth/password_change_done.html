{% extends 'storage_app/base.html' %}
{% block title %}Password Changed{% endblock %}

{% block content %}
<div class="container-fluid px-4">
    <div class="glass-card text-center" style="max-width:500px;">
        <i class="bi bi-check-circle-fill" style="font-size:2.5rem;color:#10B981;"></i>
        <h5 class="mt-3">Password changed</h5>
        <p class="text-muted">Your password was updated successfully.</p>
        <a href="{% url 'settings' %}" class="btn btn-gradient">Back to Settings</a>
    </div>
</div>
{% endblock %}
