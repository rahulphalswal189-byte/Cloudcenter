{% extends 'storage_app/base.html' %}
{% block title %}Check Your Email{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="glass-card auth-card text-center">
        <i class="bi bi-envelope-check-fill auth-icon"></i>
        <h4 class="mt-3">Check your inbox</h4>
        <p class="text-muted">If an account exists for that email, we've sent a link to reset your password.
        It expires in 1 hour.</p>
        <a href="{% url 'login' %}" class="btn btn-gradient mt-2"><i class="bi bi-arrow-left"></i> Back to Login</a>
    </div>
</div>
{% endblock %}
