{% extends 'storage_app/base.html' %}
{% block title %}Password Reset Complete{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="glass-card auth-card text-center">
        <i class="bi bi-check-circle-fill auth-icon" style="color:#10B981;"></i>
        <h4 class="mt-3">Password updated!</h4>
        <p class="text-muted">Your password has been changed successfully. You can now log in.</p>
        <a href="{% url 'login' %}" class="btn btn-gradient mt-2"><i class="bi bi-box-arrow-in-right"></i> Login</a>
    </div>
</div>
{% endblock %}
