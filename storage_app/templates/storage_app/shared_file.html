{% extends 'storage_app/base.html' %}
{% block title %}Shared File{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="glass-card auth-card text-center">
        <i class="bi bi-file-earmark-fill" style="font-size:3rem;color:var(--primary);"></i>
        <h4 class="mt-3">{{ file.file_name }}</h4>
        <p class="text-muted">{{ file.size_display }} • Shared file</p>
        <a href="{% url 'shared_file_download' file.share_token %}" class="btn btn-gradient"><i class="bi bi-download"></i> Download</a>
        <p class="small text-muted mt-3">This is a publicly shared link. Anyone with this URL can download the file.</p>
    </div>
</div>
{% endblock %}
